<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programaciones | Sistema de Capacitación</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/programaciones.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 2% auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 600px; font-family: 'Poppins', sans-serif; max-height: 90vh; overflow-y: auto; }
        .cerrar { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .cerrar:hover { color: #000; }
        .modal-content form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .modal-content label { font-weight: 500; }
        .modal-content input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-family: 'Poppins', sans-serif; }
        .modal-content button { background-color: #0062ff; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 500; margin-top: 10px; }
        .modal-content button:hover { background-color: #004ecc; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Novatech</span>
        </div>
        <ul class="menu">
            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>
            </li>
            <li>
                <a href="usuarios.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Usuarios</span>
                </a>
            </li>
            <li>
                <a href="empleados.html">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>Empleados</span>
                </a>
            </li>
            <li>
                <a href="capacitaciones.html">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Capacitaciones</span>
                </a>
            </li>
            <li class="active">
                <a href="programaciones.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Programaciones</span>
                </a>
            </li>
            <li class="logout">
                <a href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar sesión</span>
                </a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1>Gestión de Programaciones</h1>
                <p>Planificación y organización de cursos</p>
            </div>
        </header>

        <section class="panel">
            <div class="panel-header">
                <h3>Listado de Programaciones</h3>
                <button id="btnNuevaProgramacion">Nueva Programación</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Capacitación</th>
                        <th>Fechas (Inicio - Fin)</th>
                        <th>Horario</th>
                        <th>Lugar</th>
                        <th>Cupo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaProgramaciones">
                </tbody>
            </table>
        </section>
    </main>
</div>

<div id="modalProgramacion" class="modal">
    <div class="modal-content">
        <span class="cerrar" id="cerrarModal">&times;</span>
        <h2>Registrar Nueva Programación</h2>
        <form id="formProgramacion">
            <div class="form-grid">
                <div>
                    <label>ID Capacitación</label>
                    <input type="number" name="id_capacitacion" required>
                </div>
                <div>
                    <label>ID Responsable (Usuario)</label>
                    <input type="number" name="id_responsable" required>
                </div>
                <div>
                    <label>Fecha de Inicio</label>
                    <input type="date" name="fecha_inicio" required>
                </div>
                <div>
                    <label>Fecha de Fin</label>
                    <input type="date" name="fecha_fin" required>
                </div>
                <div>
                    <label>Hora de Inicio</label>
                    <input type="time" name="hora_inicio" required>
                </div>
                <div>
                    <label>Hora de Fin</label>
                    <input type="time" name="hora_fin" required>
                </div>
            </div>
            <div>
                <label>Lugar / Plataforma</label>
                <input type="text" name="lugar" required>
            </div>
            <div>
                <label>Cupo Máximo</label>
                <input type="number" name="cupo_maximo" required>
            </div>
            <button type="submit">Guardar Programación</button>
        </form>
    </div>
</div>

<script src="js/programaciones.js"></script>
<script src="js/seguridad.js"></script>
</body>
</html>
