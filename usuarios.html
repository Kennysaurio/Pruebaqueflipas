<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Sistema de Capacitación</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/usuarios.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <style>
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 500px; font-family: 'Poppins', sans-serif; }
        .cerrar { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .cerrar:hover { color: #000; }
        .modal-content form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .modal-content label { font-weight: 500; }
        .modal-content input, .modal-content select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-family: 'Poppins', sans-serif; }
        .modal-content button { background-color: #0062ff; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 500; }
        .modal-content button:hover { background-color: #004ecc; }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Novatech</span>
        </div>
        <ul class="menu">
            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>
            </li>
            <li class="active">
                <a href="usuarios.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Usuarios</span>
                </a>
            </li>
            <li>
                <a href="empleados.html">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>Empleados</span>
                </a>
            </li>
            <li>
                <a href="capacitaciones.html">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Capacitaciones</span>
                </a>
            </li>
            <li class="logout">
                <a href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar sesión</span>
                </a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1>Gestión de Usuarios</h1>
                <p>Administración de usuarios del sistema</p>
            </div>
        </header>

        <section class="panel">
            <div class="panel-header">
                <h3>Listado de Usuarios</h3>
                <button id="btnNuevoUsuario">Nuevo Usuario</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>CI</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaUsuarios">
                    <!-- Los datos se cargarán aquí desde PHP -->
                </tbody>
            </table>
        </section>
    </main>
</div>

<!-- Modal para Nuevo Usuario -->
<div id="modalUsuario" class="modal">
    <div class="modal-content">
        <span class="cerrar" id="cerrarModal">&times;</span>
        <h2>Registrar Nuevo Usuario</h2>
        <form id="formUsuario">
            <div>
                <label>ID Empleado (Debe existir en tabla empleados)</label>
                <input type="number" name="id_empleado" required>
            </div>
            <div>
                <label>Contraseña</label>
                <input type="password" name="contrasena" required>
            </div>
            <div>
                <label>Rol</label>
                <select name="rol" required>
                    <option value="Gerente">Gerente</option>
                    <option value="Responsable">Responsable</option>
                </select>
            </div>
            <button type="submit">Guardar Usuario</button>
        </form>
    </div>
</div>

<script src="js/usuarios.js"></script>
<script src="js/seguridad.js"></script>
</body>
</html>
