<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Capacitación | Novatech Solutions</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

    <div class="contenedor">

        <!-- Panel izquierdo -->
        <div class="lado-izquierdo">

            <div class="contenido">

                <i class="fa-solid fa-graduation-cap logo"></i>

                <h1>Novatech Solutions</h1>

                <h2>Sistema de Capacitación</h2>

                <p>
                    Administra cursos, certificaciones,
                    empleados y reportes desde una sola plataforma.
                </p>

            </div>

        </div>

        <!-- Panel derecho -->
        <div class="lado-derecho">

            <form class="login" id="formLogin">

                <h2>Bienvenido</h2>

                <p>Ingrese sus credenciales</p>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

<input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

 <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

                </div>

                <div class="opciones">

                    <label>

                        <input type="checkbox">

                        Recordarme

                    </label>

                    <a href="#">¿Olvidó su contraseña?</a>

                </div>

                <button type="submit">

                    Iniciar Sesión

                </button>

            </form>

        </div>

    </div>

 <script src="js/login.js"></script>
</body>

</html>
