<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitaciones | Sistema de Capacitación</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/capacitaciones.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Novatech</span>
        </div>
        <ul class="menu">
            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>
            </li>
            <li>
                <a href="usuarios.html">
                    <i class="fa-solid fa-users"></i>
                    <span>Usuarios</span>
                </a>
            </li>
            <li>
                <a href="empleados.html">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>Empleados</span>
                </a>
            </li>
            <li class="active">
                <a href="capacitaciones.html">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Capacitaciones</span>
                </a>
            </li>
            <li class="logout">
                <a href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Cerrar sesión</span>
                </a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <h1>Gestión de Capacitaciones</h1>
                <p>Administración de cursos de capacitación</p>
            </div>
        </header>

        <section class="panel">
            <div class="panel-header">
                <h3>Listado de Capacitaciones</h3>
                <button id="btnNuevaCapacitacion">Nueva Capacitación</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Capacitación</th>
                        <th>Duración</th>
                        <th>Modalidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!-- El identificador en tbody es vital para que JavaScript inyecte los datos -->
                <tbody id="cuerpoTablaCapacitaciones">
                    <!-- Los datos se cargarán dinámicamente desde la base de datos -->
                </tbody>
            </table>
        </section>
    </main>
</div>

<!-- Estructura de la ventana modal sincronizada con su JavaScript original -->
<div id="modalCapacitacion" class="modal-oculto">
    <div class="modal-contenido">
        <div class="modal-cabecera">
            <h2>Registrar Nueva Capacitación</h2>
            <span class="btn-cerrar-modal" id="cerrarModal">&times;</span>
        </div>
        <div class="modal-cuerpo">
            <form id="formCapacitacion">
                <div class="grupo-entrada">
                    <label>Nombre de la Capacitación</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="grupo-entrada">
                    <label>Duración (Horas)</label>
                    <input type="number" name="duracion" required>
                </div>
                <div class="grupo-entrada">
                    <label>Modalidad</label>
                    <input type="text" name="modalidad" required>
                </div>
                <button type="submit" class="btn-guardar">Guardar Capacitación</button>
            </form>
        </div>
    </div>
</div>

<script src="js/capacitaciones.js"></script>
<script src="js/seguridad.js"></script>
<script src="js/tema.js"></script>
</body>
</html>
